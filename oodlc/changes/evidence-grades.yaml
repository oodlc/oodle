# yaml-language-server: $schema=https://oodlc.com/schema/v0/catalog.json
version: 0
changes:
  - id: evidence-grades
    because: >-
      Evidence is free text today, so a line Oodle saw happen (a probe's answer, a call it recorded,
      a request in a capture) reads the same as a line someone wrote (a spec's summary, an agent's note).
      People can't tell which capabilities anyone has seen working, and a capture's silence about a route
      reads as "unused". Grading each piece of evidence observed or inferred, and saying what a capture
      covered, keeps those apart. See docs/decisions/0014.
    # discover and interview write and rank evidence, explain shows it, and the hook stops an agent
    # from writing observed evidence by hand.
    reaches: [inventory.draft, systems.explain, agents.connect]
    amends:
      # explain's summary counts the capabilities nothing observed backs, in every explain run.
      - outcome: cli.explain-maps-system
        statement: oodle explain counts a project's routes, how many a capability claims, how many capabilities an outcome protects and how many only inferred evidence backs
        expect:
          body:
            summary.inferred_only: 0
      - outcome: cli.undefined-word-named
        expect:
          body:
            summary.inferred_only: 0
    rules_out: [new effects, new hosts, new routes, new dependencies]
