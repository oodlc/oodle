name: Oodle outcome check
description: Run every declared outcome against the base branch and post the outcome diff on the pull request.
author: OODLC
branding:
  icon: shield
  color: green

inputs:
  project:
    description: 'Directory that holds the oodlc/ folder, relative to the repository root.'
    default: .
  base-ref:
    description: 'Git ref to compare against. Default: the pull request''s base branch, or the previous commit on a push.'
    default: ''
  comment:
    description: 'Post the outcome diff as a pull request comment, updated in place on every push. Needs `pull-requests: write`.'
    default: 'true'
  fail-on-blocking:
    description: 'Fail the job when something blocks: a broken outcome, a constraint violation, or a change to a promise (changed, redefined or removed outcome, constraint change) nobody has approved.'
    default: 'true'
  approvals:
    description: 'Read `/oodle approve <id@fingerprint>` lines from pull request reviews and comments by people with write access. Add `pull_request_review: { types: [submitted] }` to the workflow triggers so a review re-runs the check.'
    default: 'true'
  allow-self-approval:
    description: 'Let the pull request author approve their own changes to promises. Off by default; turn it on for a repository with a single maintainer.'
    default: 'false'
  node-version:
    description: 'Node.js version to run Oodle with.'
    default: '22'
  github-token:
    description: 'Token for the pull request comment.'
    default: ${{ github.token }}

outputs:
  blocking:
    description: 'Number of blocking findings.'
    value: ${{ steps.check.outputs.blocking }}
  approved:
    description: 'Number of approvals that unblocked a change.'
    value: ${{ steps.check.outputs.approved }}
  exit-code:
    description: "Oodle's exit code: 0 ok, 1 blocking, 2 could not run."
    value: ${{ steps.check.outputs.exit-code }}
  markdown-file:
    description: 'Path to the outcome diff as markdown.'
    value: ${{ steps.check.outputs.markdown-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Oodle
      shell: bash
      working-directory: ${{ github.action_path }}
      # When the action runs from the repository it checks (`uses: ./`), its path is the workspace:
      # `npm ci --omit=dev` there would delete the workspace's own dev dependencies. Reuse what's installed.
      run: |
        if [ -d node_modules/tsx ] && [ -d node_modules/yaml ] && [ -d node_modules/ajv ]; then
          echo "Oodle's dependencies are already installed here."
        else
          # --ignore-scripts: `prepare` builds the published entry points, which the CLI doesn't use.
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error
        fi

    - name: Check outcomes
      id: check
      shell: bash
      env:
        OODLE_BIN: ${{ github.action_path }}/bin/oodle.js
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_APPROVALS: ${{ inputs.approvals }}
        INPUT_ALLOW_SELF_APPROVAL: ${{ inputs.allow-self-approval }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        # github.base_ref is only set on pull_request events; a review event carries the base in its payload.
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: bash "${{ github.action_path }}/scripts/action.sh"

    # "Could not run" always fails; blocking findings fail unless fail-on-blocking is off.
    - name: Fail on blocking findings
      if: steps.check.outputs.exit-code != '0' && (steps.check.outputs.exit-code != '1' || inputs.fail-on-blocking == 'true')
      shell: bash
      run: |
        if [ "${{ steps.check.outputs.exit-code }}" = "1" ]; then
          echo "::error title=Oodle::${{ steps.check.outputs.blocking }} blocking finding(s). Fix a broken outcome; a change to a promise can be approved with /oodle approve in a pull request review. See the outcome diff."
        else
          echo "::error title=Oodle::Oodle could not run. See the 'Check outcomes' step."
        fi
        exit 1
