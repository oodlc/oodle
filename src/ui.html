<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Oodle Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='13' fill='%233cc8b4'/%3E%3Ccircle cx='11.5' cy='14' r='2.2' fill='%2310303a'/%3E%3Ccircle cx='20.5' cy='14' r='2.2' fill='%2310303a'/%3E%3Cpath d='M11 20c2.8 3 7.2 3 10 0' stroke='%2310303a' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Oodle's world, from oodlc-web: the status colours only ever mean a status. */
:root {
  --paper: #ffffff; --paper-2: #f1f8f6; --band: #c6f3ec; --card: #e3f8f4;
  --ink: #10303a; --ink-soft: #46616a; --line: #d9e6e4; --teal: #3cc8b4; --on-teal: #10303a;
  --held: #157a6c; --changed: #9a640a; --broken: #b8402f; --new: #6a4fc0;
  --held-bg: #e1f5f1; --changed-bg: #fbf0dc; --broken-bg: #fbe7e4; --new-bg: #eee9fa;
  --term: #10303a; --term-text: #e3f2ef; --term-dim: #8fb0b0;
  --shadow: 0 1px 2px rgb(16 48 58 / .06), 0 4px 16px rgb(16 48 58 / .05);
  --mono: ui-monospace, "SF Mono", "Spline Sans Mono", Menlo, Consolas, monospace;
  --sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1e22; --paper-2: #11282d; --band: #143a3f; --card: #14333a;
    --ink: #e6f2ef; --ink-soft: #9db5b4; --line: #23424a;
    --held: #3cc8b4; --changed: #f6b847; --broken: #f27a6b; --new: #a88beb;
    --held-bg: #123a37; --changed-bg: #3a2f17; --broken-bg: #3d2220; --new-bg: #2a2440;
    --term: #071417; --shadow: 0 1px 2px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1e22; --paper-2: #11282d; --band: #143a3f; --card: #14333a;
  --ink: #e6f2ef; --ink-soft: #9db5b4; --line: #23424a;
  --held: #3cc8b4; --changed: #f6b847; --broken: #f27a6b; --new: #a88beb;
  --held-bg: #123a37; --changed-bg: #3a2f17; --broken-bg: #3d2220; --new-bg: #2a2440;
  --term: #071417; --shadow: 0 1px 2px rgb(0 0 0 / .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper-2); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
code, .mono { font-family: var(--mono); font-size: .86em; }

.app { display: grid; grid-template-columns: 228px 1fr; min-height: 100vh; }
aside { background: var(--paper); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 18px; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 16px; letter-spacing: -.01em; }
.brand small { color: var(--ink-soft); font-size: 12px; }
nav a { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink-soft); font-weight: 500; }
nav a:hover { background: var(--paper-2); color: var(--ink); }
nav a[aria-current="page"] { background: var(--card); color: var(--ink); }
nav .count { font-size: 12px; min-width: 20px; text-align: center; padding: 0 6px; border-radius: 99px; background: var(--paper-2); color: var(--ink-soft); }
nav .count.need { background: var(--changed-bg); color: var(--changed); font-weight: 600; }
nav .count.bad { background: var(--broken-bg); color: var(--broken); font-weight: 600; }
.navsep { height: 1px; background: var(--line); margin: 10px 8px; }

main { min-width: 0; }
header.top { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
header.top .where { color: var(--ink-soft); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
header.top .grow { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--on-teal); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.content { padding: 24px 28px 64px; max-width: 1180px; }
h2 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.015em; }
h3 { font-size: 15px; margin: 0; }
.lede { color: var(--ink-soft); margin: 0 0 20px; max-width: 70ch; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }

.banner { border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; border: 1px solid var(--line); background: var(--paper); display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--changed-bg); border-color: transparent; color: var(--ink); }
.banner.bad { background: var(--broken-bg); border-color: transparent; }
.banner ul { margin: 6px 0 0; padding-left: 18px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); text-decoration: none; display: block; }
a.tile:hover { border-color: var(--teal); }
.tile .n { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--ink-soft); font-size: 13px; }
.tile .bar { height: 5px; border-radius: 3px; background: var(--paper-2); margin-top: 10px; overflow: hidden; }
.tile .bar i { display: block; height: 100%; background: var(--held); }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 12px; }
.card.intent { padding: 0; overflow: hidden; }
.intent > .head { padding: 14px 18px; background: var(--card); border-bottom: 1px solid var(--line); }
.intent > .head .id { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
.intent > .body { padding: 6px 0; }
.cap { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: start; padding: 10px 18px; cursor: pointer; border-top: 1px solid transparent; }
.cap + .cap { border-top-color: var(--line); }
.cap:hover { background: var(--paper-2); }
.cap .id { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.cap .st { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
.cap .side { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 300px; }
.cap .next { font-size: 13px; color: var(--changed); margin-top: 2px; }

.rungs { display: inline-flex; gap: 3px; padding-top: 6px; }
.rungs i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.rungs i.on { background: var(--held); border-color: var(--held); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--paper-2); color: var(--ink-soft); white-space: nowrap; line-height: 1.6; }
.pill.held { background: var(--held-bg); color: var(--held); }
.pill.broken, .pill.fails { background: var(--broken-bg); color: var(--broken); }
.pill.changed, .pill.drift { background: var(--changed-bg); color: var(--changed); }
.pill.proposed, .pill.new { background: var(--new-bg); color: var(--new); }
.pill.mono { font-family: var(--mono); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }

.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.search { flex: 1; min-width: 200px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; background: var(--paper); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: none; padding: 6px 11px; cursor: pointer; color: var(--ink-soft); font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); }

.rows { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.row { border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row > summary { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding: 11px 16px; cursor: pointer; }
.row > summary::-webkit-details-marker { display: none; }
.row > summary:hover { background: var(--paper-2); }
.row .rid { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.row .rst { color: var(--ink-soft); font-size: 14px; }
.row .rside { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 340px; }
.row .detail { padding: 4px 16px 16px; display: grid; gap: 12px; }

dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--ink-soft); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
pre.code { background: var(--term); color: var(--term-text); border-radius: 10px; padding: 12px 14px; margin: 0; overflow: auto; font: 12.5px/1.55 var(--mono); max-height: 420px; }
.problems { margin: 0; padding-left: 18px; color: var(--broken); font-size: 14px; }
.problems.warn { color: var(--changed); }
.conds { display: flex; flex-wrap: wrap; gap: 6px; }
.evidence { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.evidence li { display: flex; gap: 8px; align-items: baseline; }

.q { display: grid; gap: 8px; }
.q .ask { font-weight: 600; }
.q .about { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
.q textarea, .q input[type=text], .q select, .approve textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper); resize: vertical; }
.q textarea:focus, .q input:focus, .q select:focus, .search:focus, .approve textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; border-color: transparent; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.empty { text-align: center; padding: 48px 16px; color: var(--ink-soft); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

.drawer-bg { position: fixed; inset: 0; background: rgb(8 24 28 / .35); z-index: 20; display: none; }
.drawer-bg.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--paper); z-index: 21; transform: translateX(100%); transition: transform .18s ease; overflow-y: auto; border-left: 1px solid var(--line); }
.drawer.open { transform: none; }
.drawer .dhead { position: sticky; top: 0; background: var(--paper); padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.drawer .dbody { padding: 18px 20px 40px; display: grid; gap: 18px; }
.drawer h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--term); color: var(--term-text); padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: min(640px, calc(100% - 32px)); box-shadow: 0 6px 24px rgb(0 0 0 / .25); font-size: 14px; }
.toast.bad { background: var(--broken); color: #fff; }
.toast ul { margin: 4px 0 0; padding-left: 18px; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .drawer { transition: none; } }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; padding: 10px 16px 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0 0 8px; }
  nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; }
  nav a { flex: none; gap: 6px; }
  .navsep { display: none; }
  header.top { padding: 12px 16px; position: static; }
  #runinfo { display: none; }
  .content { padding: 18px 16px 48px; }
  .cap, .row > summary { grid-template-columns: auto 1fr; }
  .cap .side { grid-column: 2; justify-content: flex-start; max-width: none; }
  .row .rside { grid-row: auto; grid-column: 1 / -1; justify-content: flex-start; max-width: none; }
  .row > summary { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17" r="13" fill="#3cc8b4"/><circle cx="11.5" cy="14" r="2.2" fill="#10303a"/><circle cx="20.5" cy="14" r="2.2" fill="#10303a"/><path d="M11 20c2.8 3 7.2 3 10 0" stroke="#10303a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <div><b>Oodle Studio</b><small id="version">oodlc/</small></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header class="top">
      <div style="min-width:0"><h1 id="project">Loading…</h1><div class="where" id="where"></div></div>
      <div class="grow"></div>
      <span id="runinfo" class="muted small"></span>
      <button class="btn primary" id="run" type="button">Run</button>
    </header>
    <div class="content" id="view" aria-live="polite"></div>
  </main>
</div>
<div class="drawer-bg" id="drawer-bg"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
'use strict';
// ── Plumbing ─────────────────────────────────────────────────────────────────
// The token comes in the link `oodle ui` printed, as #token=…, and is kept for this tab only.
const TOKEN_KEY = 'oodle-ui-token';
(() => {
  const m = /token=([\w-]+)/.exec(location.hash);
  if (m) {
    try { sessionStorage.setItem(TOKEN_KEY, m[1]); } catch {}
    window.__token = m[1];
    history.replaceState(null, '', location.pathname + '#/overview');
  }
})();
const token = () => { if (window.__token) return window.__token; try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; } };

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'x-oodle-token': token(), ...(body === undefined ? {} : { 'content-type': 'application/json' }) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const doc = await res.json().catch(() => ({ ok: false, error: { message: `HTTP ${res.status}` } }));
  if (!res.ok || doc.ok === false && doc.error) throw Object.assign(new Error(doc.error?.message || `HTTP ${res.status}`), { doc });
  return doc;
}

/** h('div', { class: 'x', onclick }, 'text', child): text is always text, never HTML. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const pill = (text, kind, attrs = {}) => h('span', { class: `pill ${kind || ''}`, ...attrs }, text);
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const ago = (iso) => { const s = Math.round((Date.now() - Date.parse(iso)) / 1000); return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`; };
const yamlish = (v) => JSON.stringify(v, null, 2);

let toastTimer;
function toast(message, opts = {}) {
  document.querySelector('.toast')?.remove();
  const el = h('div', { class: `toast ${opts.bad ? 'bad' : ''}`, role: 'status' }, message, opts.list?.length ? h('ul', {}, opts.list.map((x) => h('li', {}, x))) : null);
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), opts.bad ? 9000 : 3500);
}
const failed = (err) => toast(err.doc?.error?.hint ? `${err.message}. ${err.doc.error.hint}` : err.message, { bad: true, list: err.doc?.error?.problems });

// ── State ────────────────────────────────────────────────────────────────────
let S = null;
let running = false;
let staleRun = false;

async function load() {
  try {
    S = await api('/api/state');
  } catch (err) {
    if (err.doc?.error?.code === 'token') return renderNoToken();
    S = err.doc || { ok: false, error: { message: err.message } };
  }
  running = !!S.running;
  staleRun = !!S.stale;
  render();
}

async function runNow() {
  running = true; renderTop();
  try {
    await api('/api/run', {});
    staleRun = false;
    await load();
  } catch (err) { failed(err); running = false; renderTop(); }
}

function events() {
  const es = new EventSource(`/api/events?token=${encodeURIComponent(token())}`);
  es.addEventListener('catalog', () => load());
  es.addEventListener('running', () => { running = true; renderTop(); });
  es.addEventListener('run', () => { staleRun = false; load(); });
}

// ── Derived views ────────────────────────────────────────────────────────────
const run = () => (S?.run?.run?.observations ? S.run.run : null);
/** A run that couldn't run at all: the app didn't load, something escaped the simulation. */
const runError = () => S?.run?.run?.error || (S?.run?.map?.error && !S?.run?.run?.observations ? S.run.map.error : null);
const map = () => (S?.run?.map && !S.run.map.error ? S.run.map : null);

/** Every condition an outcome or behavior ran under, and how it went. */
function resultsOf(kind, id) {
  const r = run();
  if (!r?.observations) return null;
  return r.observations.filter((o) => o.kind === kind && o.id === id);
}
function stateOf(kind, id, proposed) {
  const obs = resultsOf(kind, id);
  if (!obs) return { label: proposed ? 'proposed' : 'not run', kind: proposed ? 'proposed' : '' };
  if (!obs.length) return { label: 'did not run', kind: '' };
  const bad = obs.filter((o) => o.failures.length || o.violations.length || o.error);
  if (kind === 'behavior') return bad.length ? { label: 'drifted', kind: 'drift' } : { label: 'as observed', kind: 'held' };
  if (proposed) return bad.length ? { label: 'proposed · not holding', kind: 'proposed' } : { label: 'proposed · holding', kind: 'proposed' };
  return bad.length ? { label: `broken under ${bad.length}/${obs.length}`, kind: 'broken' } : { label: obs.length > 1 ? `holds under ${obs.length}` : 'holds', kind: 'held' };
}

/** The system map from the last run, or the same shape from the files alone. */
function systemView() {
  const m = map();
  if (m) return { ...m, fresh: !staleRun };
  const c = S.catalog;
  const capabilities = c.capabilities.map((cap) => {
    const outcomes = c.outcomes.filter((o) => o.capability === cap.id);
    const experiences = c.experiences.filter((e) => (e.steps || []).includes(cap.id)).map((e) => e.id);
    return {
      id: cap.id, statement: cap.statement, status: cap.status === 'proposed' ? 'proposed' : 'confirmed',
      actor: cap.actor ? { id: cap.actor, statement: c.actors.find((a) => a.id === cap.actor)?.statement } : undefined,
      intent: cap.intent, surfaces: cap.surfaces || [], evidence: cap.evidence || [],
      outcomes: outcomes.map((o) => ({ id: o.id, state: o.status === 'proposed' ? 'proposed' : 'not run' })),
      behaviors: c.behaviors.filter((b) => b.capability === cap.id).map((b) => b.id), experiences,
      constraints: [...new Set(outcomes.flatMap((o) => o.constraints || []))], calls: [], writes: [],
      rungs: { capability: cap.status !== 'proposed', outcome: outcomes.some((o) => o.status !== 'proposed'), intent: !!cap.intent, experience: experiences.length > 0 },
    };
  });
  return {
    intents: c.intents.map((i) => ({ id: i.id, statement: i.statement, proposed: i.status === 'proposed', capabilities: c.capabilities.filter((x) => x.intent === i.id).map((x) => x.id), outcomes: c.outcomes.filter((o) => o.intent === i.id && !o.capability).map((o) => o.id), experiences: c.experiences.filter((e) => e.intent === i.id).map((e) => e.id) })),
    capabilities, experiences: c.experiences, unclaimed: [], questions: [], terms: c.terms, undefined_words: [],
    summary: { capabilities: capabilities.length, confirmed: capabilities.filter((x) => x.status === 'confirmed').length, protected: null, inferred_only: null, routes: null, claimed: null },
    fresh: false, fromFiles: true,
  };
}

const counts = () => {
  if (!S?.ok) return {};
  const r = run();
  const broken = r ? new Set(r.observations.filter((o) => o.kind === 'outcome' && !o.proposed && (o.failures.length || o.violations.length || o.error)).map((o) => o.id)).size : 0;
  return {
    proposals: S.proposals.length + S.stubs.length,
    questions: S.questions.length,
    lint: S.lint.errors.length,

function constraintState(x) {
  const r = run();

  if (x.status === 'proposed') return { label: hits.length ? 'proposed · breached' : 'proposed · holding', kind: 'proposed' };

        h('div', { class: 'grid2' },
          h('pre', { class: 'code' }, S.yaml[`${p.section}:${p.id}`] || yamlish(p.entry)),
          approveForm(p.section, p.id, p.entry.statement)),
      )),
    ]),
    S.stubs.length ? [
      h('h3', { style: 'margin:20px 0 8px' }, `Stubs from traffic · ${S.stubs.length}`),
      h('p', { class: 'muted small', style: 'margin-top:0' }, 'Under proposed.stubs in oodlc/config.yaml. No run reads them. Accept one by moving it into defaults.given.stubs without its evidence: every run uses what you accept, so it stays an edit you make and review.'),
      ...S.stubs.map((s) => h('div', { class: 'card' }, h('div', { class: 'mono', style: 'font-weight:600;margin-bottom:6px' }, s.kind), h('pre', { class: 'code' }, yamlish(s.stub)))),
    ] : null,
  ];
}

const QUESTION_TAG = { statement: 'say what it does', broken: 'feels broken when', why: 'why it exists', confirm: 'confirm', define: 'define', open: 'question' };
function questionsPage() {
  return [
    h('h2', {}, 'Questions'),
    h('p', { class: 'lede' }, 'What only a person can say: what each capability does, for whom and why, what words mean, and the open questions discovery left. Each answer is written into the catalog as you give it, comments and layout kept. This is oodle interview, in a browser.'),
    personBanner(),
    S.questions.length ? S.questions.map(questionCard) : h('div', { class: 'empty card' }, h('b', {}, 'Nothing to ask'), 'Every capability says what it does, and no question is open.'),
  ];
}

function questionCard(q) {
  const card = h('div', { class: 'card q' });
  const head = h('div', {}, h('div', { class: 'conds', style: 'margin-bottom:4px' }, pill(QUESTION_TAG[q.kind], q.kind === 'confirm' ? 'proposed' : 'changed'), h('span', { class: 'about' }, `${q.about} ${q.target}`), h('span', { class: 'about' }, `· ${q.file || ''}`)), h('div', { class: 'ask' }, q.ask));
  const ev = q.evidence.length ? h('ul', { class: 'evidence muted small' }, q.evidence.map((e) => h('li', {}, e))) : null;
  const send = async (answer, btn) => {
    btn.disabled = true;
    try {
      const res = await api('/api/answer', { answer });
      toast(res.changed.length ? `Written: ${res.changed.join('; ')}` : 'Nothing to write');
      await load();
    } catch (err) { failed(err); btn.disabled = false; }
  };
  const kind = q.about;
  let control, build;
  if (q.kind === 'confirm') {
    if (!S.byPerson) control = h('p', { class: 'muted small', style: 'margin:0' }, 'Confirming is a person’s call. Start `oodle ui` from your terminal to confirm here.');
    else control = h('div', { class: 'actions' }, h('button', { class: 'btn primary small', type: 'button', onclick: (e) => send({ kind, id: q.target, confirm: true }, e.currentTarget) }, 'Yes, confirm it'));
    card.append(head, ev, control);
    return card;
  }
  if (q.kind === 'why') {
    const intents = S.catalog.intents;
    const sel = h('select', { 'aria-label': 'Intent' }, h('option', { value: '' }, 'Choose an intent…'), intents.map((i) => h('option', { value: i.id }, `${i.id}: ${i.statement}`)), h('option', { value: '__new' }, 'A new intent…'));
    const fresh = h('input', { type: 'text', placeholder: 'Why it exists, as a sentence: the new intent', style: 'display:none' });
    sel.addEventListener('change', () => (fresh.style.display = sel.value === '__new' ? '' : 'none'));
    control = h('div', { class: 'q' }, sel, fresh);
    build = () => sel.value === '__new' ? (fresh.value.trim() ? { kind, id: q.target, intent: { id: '', statement: fresh.value.trim() } } : null) : sel.value ? { kind, id: q.target, intent: sel.value } : null;
  } else {
    const ta = h('textarea', { rows: '2', placeholder: q.kind === 'statement' ? '<actor> can <verb> <object>' : q.kind === 'broken' ? 'Separate several with ;' : '' });
    control = ta;
    build = () => {
      const v = ta.value.trim();
      if (!v) return null;
      if (q.kind === 'define') return { kind: 'term', id: q.target, statement: v };
      if (q.kind === 'open') return { kind: 'unknown', id: q.target, answer: v };
      if (q.kind === 'broken') return { kind, id: q.target, feels_broken_when: v.split(';').map((s) => s.trim()).filter(Boolean) };
      return { kind, id: q.target, statement: v };
    };
  }
  const btn = h('button', { class: 'btn primary small', type: 'button', onclick: (e) => { const a = build(); if (!a) return toast('Write an answer first', { bad: true }); send(a, e.currentTarget); } }, 'Write it');
  card.append(head, ev, control, h('div', { class: 'actions' }, btn, S.byPerson ? null : h('span', { class: 'muted small' }, 'Anything new is written as a proposal.')));
  return card;
}

function changes() {
  return [
    h('h2', {}, 'Changes'),
    h('p', { class: 'lede' }, 'Changes in oodlc/changes/, agreed before their code. A pull request that does what a merged change says goes through; anything outside it blocks.'),
    S.changes.length ? S.changes.map((c) => h('div', { class: 'card' },
      h('div', { style: 'display:flex;gap:10px;align-items:baseline;flex-wrap:wrap' }, h('span', { class: 'mono', style: 'font-weight:600' }, c.id), c.origin ? pill(`agreed in ${c.origin}`, 'held') : pill('not merged yet', 'changed'), h('span', { class: 'mono muted small' }, c.file)),
      h('p', {}, c.because),
      h('dl', { class: 'kv' },
        c.reaches?.length ? [h('dt', {}, 'reaches'), h('dd', {}, c.reaches.join(', '))] : null,
        c.amends?.length ? [h('dt', {}, 'amends'), h('dd', {}, c.amends.map((a) => a.outcome || a.constraint).join(', '))] : null,
        c.rules_out?.length ? [h('dt', {}, 'rules out'), h('dd', {}, c.rules_out.map((r) => typeof r === 'string' ? r : JSON.stringify(r)).join('; '))] : null),
      h('div', { class: 'actions', style: 'margin-top:10px' }, h('button', { class: 'btn small', type: 'button', onclick: () => showBrief(c.id) }, 'Brief for a coding agent')),
    )) : h('div', { class: 'empty card' }, h('b', {}, 'No changes waiting'), 'Agree one before the code: a file in oodlc/changes/.'),
  ];
}

async function showBrief(id) {
  try {
    const { brief } = await api(`/api/changes/${encodeURIComponent(id)}/brief`);
    const copy = h('button', { class: 'btn small', type: 'button', onclick: async () => { try { await navigator.clipboard.writeText(brief); toast('Copied'); } catch { toast('Copy it from the box', { bad: true }); } } }, 'Copy');
    openDrawer(h('div', {}, h('div', { class: 'muted small' }, 'oodle changes brief'), h('h3', { style: 'font-size:18px' }, id)), [h('div', { class: 'actions' }, copy), h('pre', { class: 'code', style: 'max-height:none;white-space:pre-wrap' }, brief)]);
  } catch (err) { failed(err); }
}

function vocabulary() {
  const c = S.catalog;
  const sys = systemView();
  const list = (title, items, render) => [h('h3', { style: 'margin:20px 0 8px' }, title), items.length ? h('div', { class: 'rows' }, items.map(render)) : h('p', { class: 'muted' }, 'None yet.')];
  const simple = (x, extra) => h('div', { class: 'row' }, h('summary', { style: 'cursor:default' }, h('div', {}, h('span', { class: 'rid' }, x.id), ' ', x.status === 'proposed' ? pill('proposed', 'proposed') : null), h('div', { class: 'rside' }, extra), h('div', { class: 'rst' }, x.statement)));
  return [
    h('h2', {}, 'People & words'),
    h('p', { class: 'lede' }, 'Who uses the system, what they go through, and what its words mean here. This part of the catalog explains; it never blocks.'),
    list('Actors', c.actors, (a) => simple(a, pill(plural(c.capabilities.filter((x) => x.actor === a.id).length, 'capability', 'capabilities')))),
    list('Experiences', c.experiences, (x) => simple(x, (x.steps || []).length ? pill(x.steps.join(' → '), 'mono') : null)),
    list('Terms', c.terms, (t) => simple(t, (t.aka || []).length ? pill(`aka ${t.aka.join(', ')}`) : null)),
    sys.undefined_words?.length ? [h('h3', { style: 'margin:20px 0 8px' }, 'Words no term defines yet'), h('div', { class: 'conds' }, sys.undefined_words.map((w) => pill(w, 'changed'))), h('p', { class: 'muted small' }, 'Define them on the Questions page.')] : null,
  ];
}

function conditions() {
  const c = S.catalog;
  const usedBy = (id) => [...c.outcomes, ...c.behaviors].filter((x) => (x.conditions || []).includes(id)).map((x) => x.id);
  return [
    h('h2', {}, 'Conditions'),
    h('p', { class: 'lede' }, 'The worlds an outcome runs in: a slow provider, a returning customer, no credentials. An outcome runs under every condition it lists. The security pack’s built-in conditions are listed by oodle lint.'),
    c.conditions.length ? h('div', { class: 'rows' }, c.conditions.map((x) => h('details', { class: 'row' }, h('summary', {}, h('div', { class: 'rid' }, x.id), h('div', { class: 'rside' }, pill(plural(usedBy(x.id).length, 'user'))), h('div', { class: 'rst' }, x.statement || '')),
      h('div', { class: 'detail' }, usedBy(x.id).length ? h('div', { class: 'conds' }, usedBy(x.id).map((id) => pill(id, 'mono'))) : h('span', { class: 'muted small' }, 'Nothing runs under it.'), h('pre', { class: 'code' }, yamlish(x.given)))))) : h('div', { class: 'empty card' }, h('b', {}, 'No conditions'), 'Every outcome runs in the default world.'),
  ];
}

function lintPage() {
  const { errors, warnings } = S.lint;
  return [
    h('h2', {}, 'Lint'),
    h('p', { class: 'lede' }, 'The catalog checked against the spec and its own traceability. Errors block; warnings are advice. Fix them in the files: this page follows.'),
    !errors.length && !warnings.length ? h('div', { class: 'empty card' }, h('b', {}, 'Clean'), 'No errors and no warnings.') : null,
    errors.length ? h('div', { class: 'card' }, h('h3', { style: 'margin-bottom:8px' }, plural(errors.length, 'error')), h('ul', { class: 'problems' }, errors.map((e) => h('li', {}, e)))) : null,
    warnings.length ? h('div', { class: 'card' }, h('h3', { style: 'margin-bottom:8px' }, plural(warnings.length, 'warning')), h('ul', { class: 'problems warn' }, warnings.map((e) => h('li', {}, e)))) : null,
  ];
}

// ── Start ────────────────────────────────────────────────────────────────────
document.getElementById('run').addEventListener('click', runNow);
document.getElementById('drawer-bg').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeDrawer());
window.addEventListener('hashchange', () => { closeDrawer(); window.scrollTo(0, 0); render(); });
if (!token()) renderNoToken();
else { load(); events(); }
setInterval(() => S?.run && renderTop(), 30000);
</script>
</body>
</html>
