# yaml-language-server: $schema=https://oodlc.com/schema/v0/catalog.json
version: 0
# The inventory (docs/decisions/0010) for Oodle itself: who uses it, what it lets
# them do, and the journeys across it. `oodle discover` sees only the two routes
# of test/dogfood.ts (POST /invoke runs CLI steps, POST /diff diffs a mutated
# fixture), so capabilities are grouped by what Oodle lets people do, not by route.
actors:
  - id: developer
    statement: Someone adopting Oodle on a service, or writing its catalog, from a terminal
  - id: reviewer
    statement: A person who reads the outcome diff on a pull request and decides whether it merges
  - id: script
    statement: A CI job, script or tool that runs Oodle and acts on what it returns
  - id: coding-agent
    statement: An AI agent that writes code and catalog entries through the CLI, MCP or the Claude Code hook

capabilities:
  # Reached through POST /diff (merges.yaml)
  - id: promises.guard
    statement: A reviewer can stop a pull request that breaks, changes, redefines or removes a declared promise, and let one that only moves internals go through
    actor: reviewer
    intent: merges-guard-outcomes
    surfaces: [POST /diff]
    evidence:
      - "outcomes oodle.broken-outcome-blocks, oodle.refactor-goes-through, oodle.changed-output-needs-review, oodle.broken-outcome-not-approvable, oodle.constraint-removal-needs-approval, oodle.redefined-outcome-needs-approval, oodle.network-escape-blocks"
      - docs/decisions/0001, 0002, 0005
  - id: changes.approve
    statement: A reviewer can approve a changed or redefined promise so the pull request goes through, and never a broken one
    actor: reviewer
    intent: merges-guard-outcomes
    surfaces: [POST /diff]
    evidence:
      - outcomes oodle.approved-change-goes-through, oodle.broken-outcome-not-approvable
      - docs/decisions/0007
  - id: behavior.report
    statement: A reviewer can see how observed behavior moved and which routes nothing describes, without being blocked
    actor: reviewer
    intent: behavior-is-visible
    surfaces: [POST /diff]
    evidence:
      - outcomes oodle.behavior-drift-reported, oodle.unknown-route-surfaced
      - docs/decisions/0001
  - id: proposals.add
    statement: A coding agent can add catalog entries as proposals that run and are reported but block nothing until a person approves them
    actor: coding-agent
    intent: agents-propose-humans-approve
    surfaces: [POST /diff, POST /invoke]
    evidence:
      - outcomes oodle.proposal-never-blocks, cli.propose-only-adds
      - docs/decisions/0006

  # Reached through POST /invoke (cli.yaml)
  - id: results.read
    statement: A script can read every result and every error as one JSON document with stable codes, and list the whole CLI the same way
    actor: script
    intent: scriptable
    surfaces: [POST /invoke]
    evidence:
      - outcomes cli.json-results, cli.json-errors, cli.describes-itself
      - constraints documented-exit-codes, json-mode-is-clean
      - docs/cli.md
  - id: mistakes.correct
    statement: A developer who mistypes a command or flag is told the one they meant
    actor: developer
    intent: self-serve
    surfaces: [POST /invoke]
    evidence:
      - outcomes cli.typo-suggests-command, cli.typo-suggests-flag
  - id: projects.start
    statement: A developer can start a project that passes its first run, and check that their setup is ready
    actor: developer
    intent: self-serve
    surfaces: [POST /invoke]
    evidence:
      - outcomes cli.init-starts-green, cli.doctor-checks-setup, cli.answers-fast
      - docs/first-outcome.md

  # The inventory, changes, mutate, agents and CI (cli.yaml and merges.yaml).
  - id: systems.explain
    statement: A developer can see each intent, the capabilities that serve it, who they are for and whether their outcomes hold, as a map or a page
    actor: developer
    intent: systems-are-explained
    surfaces: [POST /invoke]
    evidence:
      - oodle explain (src/explain.ts)
      - docs/decisions/0010, 0011
  - id: inventory.draft
    statement: A developer can have Oodle propose capabilities and open questions from the app's routes, an OpenAPI spec or captured traffic, and answer them in an interview
    actor: developer
    intent: systems-are-explained
    surfaces: [POST /invoke]
    evidence:
      - oodle discover, oodle interview (src/discover.ts, src/interview.ts, src/evidence.ts)
      - docs/decisions/0010, 0011
  - id: terms.define
    statement: A developer can say what each word in the catalog means here, and be told where a statement uses one nobody defined
    actor: developer
    intent: systems-are-explained
    surfaces: [POST /invoke]
    evidence:
      - terms section, oodle lint, oodle interview (src/terms.ts)
      - docs/decisions/0013
  - id: changes.agree
    statement: A reviewer can agree what a change will do before its code exists, and a coding agent can build against that agreement
    actor: reviewer
    intent: agents-propose-humans-approve
    surfaces: [POST /invoke]
    evidence:
      - oodle changes list, brief, fold (src/changes.ts)
      - docs/decisions/0012
  - id: catalog.test
    statement: A developer can plant small bugs in the app and see which ones the catalog fails to catch
    actor: developer
    intent: merges-guard-outcomes
    surfaces: [POST /invoke]
    evidence:
      - oodle mutate (src/mutate.ts)
  - id: agents.connect
    statement: A coding agent can read the catalog, run outcomes and propose entries over MCP, and is stopped by the Claude Code hook from editing what blocks a merge
    actor: coding-agent
    intent: agents-propose-humans-approve
    surfaces: [POST /invoke]
    evidence:
      - oodle mcp, oodle hook (src/mcp.ts, src/hooks.ts), docs/agents.md
      - docs/decisions/0006
  - id: merges.annotate
    statement: A reviewer can read the outcome diff as a pull request comment and as annotations, from the GitHub Action
    actor: reviewer
    intent: merges-guard-outcomes
    surfaces: [POST /diff]
    evidence:
      - action.yml, src/ci.ts
      - condition github_actions
      - docs/decisions/0007

experiences:
  - id: adopt-on-existing-service
    statement: A developer with an existing service goes from nothing to a pull request that Oodle guards, without writing a brief first
    actor: developer
    intent: self-serve
    steps: [projects.start, inventory.draft, terms.define, systems.explain, promises.guard]
    feels_broken_when:
      - the first run after init is red
      - discover proposes only TODO statements and no questions
      - the interview asks about something the developer already answered
      - explain shows no route as protected after outcomes were added
    evidence:
      - README.md (Getting started, Systems Oodle can't run), docs/first-outcome.md
  - id: agent-builds-an-agreed-change
    statement: A reviewer agrees a change, a coding agent builds it, and the pull request passes without a second approval if it did exactly what was agreed
    actor: coding-agent
    intent: agents-propose-humans-approve
    steps: [changes.agree, agents.connect, promises.guard, changes.approve]
    feels_broken_when:
      - a pull request that does what the change says still asks for approval
      - something outside the change's reach moves and nothing blocks
      - the agent is allowed to edit an approved outcome
    evidence:
      - docs/decisions/0012, docs/agents.md
  - id: review-a-pull-request
    statement: A reviewer reads one comment and knows which promises a pull request breaks or changes, what behavior moved, and what they are being asked to approve
    actor: reviewer
    intent: merges-guard-outcomes
    steps: [merges.annotate, promises.guard, behavior.report, changes.approve]
    feels_broken_when:
      - behavior drift blocks the merge
      - approving everything unblocks a broken outcome
      - the comment names an outcome but not why it moved
    evidence:
      - action.yml, docs/decisions/0007
