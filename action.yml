name: Oodle outcome check
description: Run every declared outcome against the base branch and post the outcome diff on the pull request.
author: OODLC
branding:
  icon: shield
  color: green

inputs:
  project:
    description: 'Directory that holds oodle.yaml, relative to the repository root.'
    default: .
  base-ref:
    description: 'Git ref to compare against. Default: the pull request''s base branch, or the previous commit on a push.'
    default: ''
  comment:
    description: 'Post the outcome diff as a pull request comment, updated in place on every push. Needs `pull-requests: write`.'
    default: 'true'
  fail-on-blocking:
    description: 'Fail the job when a human needs to approve something (a broken, changed, redefined or removed outcome, or a constraint change or violation).'
    default: 'true'
  node-version:
    description: 'Node.js version to run Oodle with.'
    default: '22'
  github-token:
    description: 'Token for the pull request comment.'
    default: ${{ github.token }}

outputs:
  blocking:
    description: 'Number of blocking findings.'
    value: ${{ steps.check.outputs.blocking }}
  exit-code:
    description: "Oodle's exit code: 0 ok, 1 blocking, 2 could not run."
    value: ${{ steps.check.outputs.exit-code }}
  markdown-file:
    description: 'Path to the outcome diff as markdown.'
    value: ${{ steps.check.outputs.markdown-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Oodle
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund --loglevel=error

    - name: Check outcomes
      id: check
      shell: bash
      env:
        OODLE_BIN: ${{ github.action_path }}/bin/oodle.js
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BASE_REF: ${{ github.base_ref }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: bash "${{ github.action_path }}/scripts/action.sh"

    # "Could not run" always fails; blocking findings fail unless fail-on-blocking is off.
    - name: Fail on blocking findings
      if: steps.check.outputs.exit-code != '0' && (steps.check.outputs.exit-code != '1' || inputs.fail-on-blocking == 'true')
      shell: bash
      run: |
        if [ "${{ steps.check.outputs.exit-code }}" = "1" ]; then
          echo "::error title=Oodle::${{ steps.check.outputs.blocking }} blocking finding(s). A human needs to approve them; see the outcome diff."
        else
          echo "::error title=Oodle::Oodle could not run. See the 'Check outcomes' step."
        fi
        exit 1
